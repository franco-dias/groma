<!--
  The side panel. `data-tab` on a button names the tab it opens; `data-for`
  on a section names the tab it belongs to (see styles/panel.css).
-->
<div class="header">
  <button class="tab" data-tab="specs">Specs</button>
  <button class="tab" data-tab="css">All CSS</button>
  <button class="tab" data-tab="layers">Layers</button>
  <button class="tab" data-tab="changes">Changes</button>
  <span class="spacer"></span>
  <button class="collapse" title="Collapse or expand the panel">»</button>
  <button class="close" title="Close">✕</button>
</div>

<!-- Specs: what a developer needs to build the element -->
<div class="toolbar actions" data-for="specs">
  <button class="action" data-action="unit" title="Show and copy lengths in px or rem"></button>
  <button class="action" data-action="grid" title="Grid over the artboard: off, 4 or 8"></button>
  <button class="action" data-action="compare" title="Compare this element with the next one you pin"></button>
  <button class="action" data-action="link" title="Copy a link that reopens this page with the element pinned">copy link</button>
  <button class="action" data-action="pick" title="Pick any colour on screen">pick colour</button>
</div>
<div class="body" data-for="specs"></div>

<!-- All CSS: every computed property, editable -->
<div class="search" data-for="css">
  <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="rgba(200,196,188,0.4)" stroke-width="1.5" stroke-linecap="round">
    <circle cx="5" cy="5" r="3.5" />
    <path d="M8 8l2.5 2.5" />
  </svg>
  <input type="text" placeholder="Search properties…" />
  <button class="clear" title="Clear search">✕</button>
</div>
<div class="toolbar" data-for="css">
  <label><input type="checkbox" data-option="hideDefaults" checked style="accent-color: #e8c97a" />Hide defaults</label>
  <label><input type="checkbox" data-option="highlightPinned" checked style="accent-color: #0d99ff" />Highlight element</label>
</div>
<div class="body" data-for="css"></div>

<!-- Layers: the artboard's element tree -->
<div class="body" data-for="layers"></div>

<!-- Changes: this export against an older one -->
<div class="body" data-for="changes"></div>
<input type="file" accept=".html,text/html" hidden />

<div class="resize"></div>
