<!--
  The side panel. `data-tab` on a tab names the tab it opens; `data-for` on a
  section names the tab it belongs to (see styles/panel.css). Sections with no
  content here are filled by the tab's TypeScript file.
-->
<div class="tab-bar">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="specs">Specs</button>
    <button class="tab" role="tab" data-tab="css">All CSS</button>
    <button class="tab" role="tab" data-tab="layers">Layers</button>
    <button class="tab" role="tab" data-tab="edits">Edits</button>
    <button class="tab" role="tab" data-tab="changes">Changes</button>
  </div>
  <button class="icon-button more-button" aria-label="More" aria-haspopup="menu" aria-expanded="false" title="More">
    <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="m6 17 5-5-5-5M13 17l5-5-5-5" /></svg>
  </button>
  <button class="icon-button close" aria-label="Close inspector" title="Close inspector">
    <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
  </button>
</div>

<!-- The » menu: what does not fit in the tab bar. -->
<div class="more-menu" role="menu" hidden>
  <button class="more-item" role="menuitem" data-tab="reference"><span class="slot"></span>Shortcuts and tips</button>
  <button class="more-item" role="menuitemcheckbox" aria-checked="true" data-action="push" title="Take the panel's width out of the page instead of covering it">
    <svg class="icon check" width="12" height="12" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></svg>Push the page aside
  </button>
  <button class="more-item" role="menuitemcheckbox" aria-checked="false" data-action="canvas" title="Show the page in a frame you can resize and zoom">
    <svg class="icon check" width="12" height="12" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></svg>Show on a canvas
  </button>
  <button class="more-item collapse" role="menuitem"><span class="slot"></span>Collapse panel</button>
</div>

<!--
  Edits saved on an earlier visit, which are not on the page after it loads.
  Shown on every tab, since the values in them are the page's until the edits
  are put back (panel/edits/apply-bar.ts). It slides in and out; `is-off` is the
  closed state. After "Discard" it reads "N edits discarded" with "Undo"
  (`is-discarded`).
-->
<div class="apply-bar is-off" role="status">
  <div class="apply-clip"><div class="apply-inner">
    <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M12 9v4" /><path d="M12 17h.01" /><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /></svg>
    <span class="apply-text"></span>
    <button class="ghost-button" data-action="discard-edits" title="Remove these saved edits. Undo brings them back.">Discard</button>
    <button class="apply-button" data-action="apply-edits" title="Put your saved edits back on the page">Apply</button>
    <button class="ghost-button" data-action="undo-discard" title="Bring the discarded edits back">Undo</button>
  </div></div>
</div>

<!-- ───────────── Specs: what a developer needs to build the element ───────────── -->
<div class="action-bar" data-for="specs">
  <div class="segmented" role="radiogroup" aria-label="Units" data-option="unit">
    <button class="segment" role="radio" data-value="px">px</button>
    <button class="segment" role="radio" data-value="rem">rem</button>
  </div>
  <div class="segmented" role="radiogroup" aria-label="Grid" data-option="grid">
    <span class="lead">
      <svg class="icon" width="12" height="12" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18M3 15h18M9 3v18M15 3v18" /></svg>
    </span>
    <button class="segment" role="radio" data-value="0">Off</button>
    <button class="segment is-on" role="radio" data-value="4">4</button>
    <button class="segment is-on" role="radio" data-value="8">8</button>
  </div>
  <span class="spacer"></span>
  <button class="action" data-action="compare" aria-pressed="false" aria-label="Compare" title="Compare this element with the next one you pin">
    <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><circle cx="18" cy="18" r="3" /><circle cx="6" cy="6" r="3" /><path d="M13 6h3a2 2 0 0 1 2 2v7M11 18H8a2 2 0 0 1-2-2V9" /></svg>
    <span class="when-on">Comparing</span>
  </button>
  <button class="action" data-action="link" aria-label="Copy link to element" title="Copy a link that reopens this page with the element pinned">
    <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></svg>
  </button>
  <button class="action" data-action="pick" aria-pressed="false" aria-label="Pick color" title="Pick any color on screen">
    <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="m2 22 1-1h3l9-9M3 21v-3l9-9" /><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z" /></svg>
  </button>
</div>
<div class="element-header" data-for="specs"></div>
<div class="body" data-for="specs"></div>

<!-- ───────────── All CSS: every computed property, editable ───────────── -->
<div class="search" data-for="css">
  <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
  <input type="text" placeholder="Search properties" />
  <button class="icon-button clear" aria-label="Clear search" title="Clear search">
    <svg class="icon" width="12" height="12" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
  </button>
</div>
<div class="switches" data-for="css">
  <label><input type="checkbox" data-option="hideDefaults" checked />Hide defaults</label>
  <label><input type="checkbox" data-option="highlightPinned" checked />Outline element</label>
</div>
<div class="body css-body" data-for="css"></div>

<!-- ───────────── Layers: the artboard's element tree ───────────── -->
<div class="body tree" data-for="layers" role="tree"></div>

<!-- ───────────── Edits: everything the user changed on this page ───────────── -->
<div class="action-bar" data-for="edits">
  <button class="action" data-action="undo" aria-label="Undo" title="Undo the last edit">
    <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10a6 6 0 0 1 0 12h-3" /></svg>
    <span class="action-label">Undo</span>
  </button>
  <button class="action" data-action="redo" aria-label="Redo" title="Redo the edit you undid">
    <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" /><path d="M20 9H10a6 6 0 0 0 0 12h3" /></svg>
    <span class="action-label">Redo</span>
  </button>
  <button class="action" data-action="original" aria-pressed="false" aria-label="Show the original page" title="Show the page without your edits. They stay saved.">
    <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></svg>
    <span class="action-label">Show original</span>
  </button>
  <span class="spacer"></span>
  <button class="ghost-button" data-action="copy-edits" title="Copy every edit as a text a coding agent can apply">
    <svg class="icon" width="12" height="12" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" /></svg>Copy edits
  </button>
</div>
<div class="body edits-list" data-for="edits"></div>

<!-- ───────────── Changes: this export against an older one ───────────── -->
<div class="changes-head" data-for="changes"></div>
<div class="body changes-list" data-for="changes"></div>
<input type="file" accept=".html,text/html" hidden />

<!-- ───────────── Reference: every shortcut and trick (reference.html) ───────────── -->
<div class="body" data-for="reference"></div>

<!-- Shown instead of the tabs' content while the panel is open with nothing pinned. -->
<div class="empty">
  <b>Nothing pinned</b>
  <p>Hold <kbd data-key="alt"></kbd> and click an element to see its specs here.</p>
</div>

<!--
  The foot of the panel, on every tab: the switch that locks inspect mode on
  so that text on the page can be edited (panel/text-edit-switch.ts).
-->
<label class="panel-foot" title="Locks inspect mode on, like the Inspect pill. Then double-click any text on the page to edit it.">
  <input type="checkbox" data-option="text-edit" />
  <span class="foot-label">Edit text inline (lock inspecting)</span>
  <span class="hint">Double-click text on the page</span>
</label>

<!-- Shown instead of everything above while the panel is collapsed. -->
<button class="rail" aria-label="Expand panel" title="Expand panel">
  <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 2v4M12 18v4M2 12h4M18 12h4" /></svg>
  <span class="name"></span>
</button>

<div class="resize"></div>
