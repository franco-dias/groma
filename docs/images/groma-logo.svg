<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Groma">
  <title>Groma</title>
  <style>
    /* The final frame is the plain drawing; each animation only describes where a part starts. */
    .measure { fill: #f04438; transform-box: fill-box; transform-origin: 0 50%; animation: grow-x .45s ease-out 1.5s both }
    .staff { fill: #fafafa; transform-box: fill-box; transform-origin: 50% 0; animation: grow-y .5s ease-out both }
    .bar { fill: #fafafa; transform-box: fill-box; transform-origin: 50% 50%; animation: grow-x .35s ease-out .3s both }
    .string { fill: none; stroke: #fafafa; stroke-width: 3; stroke-linecap: round }
    .bob { fill: #fafafa }
    .tick { fill: none; stroke: #f04438; stroke-width: 2.6; stroke-linecap: round; animation: fade .15s ease-out 1.9s both }
    .plumb { animation: swing .9s cubic-bezier(.3, 0, .2, 1) .6s both }
    .left { transform-origin: 15.5px 18px }
    .right { transform-origin: 48.5px 18px; animation-name: swing-back }
    @keyframes grow-y { from { transform: scaleY(0) } }
    @keyframes grow-x { from { transform: scaleX(0) } }
    @keyframes fade { from { opacity: 0 } }
    @keyframes swing {
      0% { opacity: 0; transform: rotate(20deg) }
      10% { opacity: 1 }
      32% { transform: rotate(-12deg) }
      56% { transform: rotate(7deg) }
      78% { transform: rotate(-3deg) }
    }
    @keyframes swing-back {
      0% { opacity: 0; transform: rotate(-20deg) }
      10% { opacity: 1 }
      32% { transform: rotate(12deg) }
      56% { transform: rotate(-7deg) }
      78% { transform: rotate(3deg) }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <!-- the tile: dark, with a faint ring so its edge shows on a dark page -->
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="#171717" stroke="#3a3a3a" />
  <!-- the measurement, behind the instrument -->
  <rect class="measure" x="15.5" y="24.7" width="33" height="2.6" rx="1.3" />
  <!-- staff, a stake driven into the ground; then the cross bar -->
  <path class="staff" d="M28.5 12H35.5V47L32 55L28.5 47Z" />
  <rect class="bar" x="10" y="11" width="44" height="7" rx="3.5" />
  <!-- plumb lines with their bobs, swinging from the ends of the bar until they hang true -->
  <g class="plumb left">
    <path class="string" d="M15.5 18V34" />
    <rect class="bob" x="11.5" y="33" width="8" height="4" rx="1.5" />
    <path class="bob" d="M12 37H19L15.5 49Z" />
  </g>
  <g class="plumb right">
    <path class="string" d="M48.5 18V34" />
    <rect class="bob" x="44.5" y="33" width="8" height="4" rx="1.5" />
    <path class="bob" d="M45 37H52L48.5 49Z" />
  </g>
  <path class="tick" d="M15.5 22.5v7M48.5 22.5v7" />
</svg>
